name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Official Compact devtools install (docs.midnight.network/relnotes/compact):
      # devtools manage the toolchain; compact update pins the support-matrix version.
      # NOTE: the installer drops the binary at $HOME/.local/bin with no `env`
      # file, so export PATH directly (and persist via GITHUB_PATH for later steps).
      - name: Install Compact toolchain (0.31.1)
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/download/compact-v0.5.1/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          compact update 0.31.1
          compact compile --version

      - name: Install dependencies
        run: npm ci

      - name: Compile contract
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          npm run compile

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build
